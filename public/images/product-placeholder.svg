<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00" />
      <stop offset="100%" stop-color="#E05300" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern / Card outline -->
  <rect x="40" y="40" width="520" height="520" rx="24" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  
  <!-- Central Icon: Modern Shopping Package / Isometric Box -->
  <g transform="translate(180, 160)">
    <!-- Package Base -->
    <path d="M120 20 L220 75 L120 130 L20 75 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4" stroke-linejoin="round" />
    <path d="M20 75 L120 130 L120 240 L20 185 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="4" stroke-linejoin="round" />
    <path d="M220 75 L120 130 L120 240 L220 185 Z" fill="#94A3B8" stroke="#64748B" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Package Tape Accent -->
    <path d="M95 34 L145 61 L145 116 L95 89 Z" fill="url(#accentGrad)" opacity="0.85" />
    <path d="M95 89 L145 116 L145 226 L95 199 Z" fill="url(#accentGrad)" opacity="0.7" />
  </g>
  
  <!-- Fayzee Branding & Placeholder Text -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="300" y="450" font-size="22" font-weight="700" fill="#475569" letter-spacing="1">FAYZEE MARKETPLACE</text>
    <text x="300" y="485" font-size="16" font-weight="500" fill="#94A3B8">Product Image</text>
  </g>
</svg>
